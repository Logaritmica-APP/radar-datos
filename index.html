<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101519">
<title>Radar Financiero Ecuador</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b1013; --panel:#161e23; --line:#2c393f;
  --text:#eef3f4; --muted:#abbac0; --up:#65eba4;
  --down:#ff8089; --flat:#b7c2c6; --amber:#ffcb70;
}
* {box-sizing:border-box}
body {margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,sans-serif}
main {max-width:550px; margin:auto; padding:20px 16px 100px;
  /* Márgenes seguros de la app Android (barras del sistema); en el navegador valen 0 */
  padding-top:calc(20px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  padding-bottom:calc(100px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
header {border-bottom:1px solid var(--line); padding-bottom:16px}
.titulo {display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.engrane {min-width:44px; min-height:44px; font-size:24px; background:none; border:1px solid var(--line); border-radius:12px; color:inherit; margin-top:14px}
.engrane[aria-current="page"] {color:#8ee7ca; border-color:#8ee7ca}
h1 {font-size:clamp(23px,6vw,30px); margin:3px 0 12px}
h2 {font-size:20px; margin:20px 0 8px}
h3 {font-size:17px; margin:6px 0}
small,.muted {color:var(--muted)}
small {font-size:12px}
label {display:block; font-size:13px; color:var(--muted)}
button,select {font:inherit; color:inherit}
button {cursor:pointer}
select,.back,.more {border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:10px 12px; min-height:44px}
select {width:100%; margin-top:5px}
.back,.more {margin-top:12px}
.row {display:grid; grid-template-columns:minmax(0,1fr) 48px auto; align-items:center; gap:8px; width:100%; min-height:66px;
  text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:9px 0}
.row:hover,.row:focus-visible {background:var(--panel)}
.row small,.row strong {display:block}
.quote {text-align:right; font-variant-numeric:tabular-nums}
.quote small {color:inherit}
.up {color:var(--up)} .down {color:var(--down)} .flat {color:var(--flat)}
.card {background:var(--panel); padding:14px; margin:10px 0; border:1px solid var(--line); border-radius:12px}
.alert {border-left:3px solid var(--amber)}
.periodo {margin-top:26px}
.atajos {margin:10px 0 8px}
.atajos .chips {margin-top:6px}
.rango {display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rango label {display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted, #9aa)}
.rango input {min-height:44px; background:transparent; color:inherit; border:1px solid var(--line); border-radius:9px; padding:0 8px; color-scheme:dark}
.chips {grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap}
.chip {min-height:40px; padding:0 14px; border:1px solid var(--line); background:transparent; color:inherit; border-radius:20px}
.chip.activo {border-color:var(--amber); color:var(--amber)}
.orden {display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:48px; border-bottom:1px solid var(--line)}
.orden:last-child {border-bottom:0}
.flecha {min-width:44px; min-height:44px; border:1px solid var(--line); background:transparent; color:inherit; border-radius:9px; font-size:18px}
.flecha:disabled {opacity:.3}
.atrasado {color:var(--amber)}
p.atrasado {font-size:14px}
.aviso {width:100%; text-align:left; color:var(--amber); margin:4px 0 6px}
.check {display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--line)}
.check:last-child {border-bottom:0}
.check input {width:20px; height:20px}
.seccion {margin:18px 0 6px}
.seccion > summary {font-size:17px; padding:4px 0; border-bottom:1px solid var(--line); margin-bottom:8px}
.plegable summary {cursor:pointer; min-height:44px; display:flex; align-items:center; gap:6px; list-style:none}
.plegable summary::-webkit-details-marker {display:none}
.plegable summary::before {content:"▸"; color:var(--flat); transition:transform .15s}
.plegable[open] summary::before {transform:rotate(90deg)}
.tasas {width:100%; border-collapse:collapse; margin:8px 0; font-size:14px}
.tasas th {text-align:right; font-weight:600; color:var(--flat); padding:6px 4px; border-bottom:1px solid var(--line)}
.tasas th:first-child, .tasas td:first-child {text-align:left}
.tasas td {text-align:right; padding:9px 4px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.tasas tr[data-id] {cursor:pointer}
.tag {color:var(--amber); font-size:12px; font-weight:700}
.big {font-size:36px; font-weight:750; font-variant-numeric:tabular-nums}
.spark {width:48px; height:26px}
.chart {width:100%; height:auto; display:block}
.ends {display:flex; justify-content:space-between; gap:8px}
.estado {display:flex; gap:8px; align-items:center; margin:10px 0 0; font-size:13px; color:var(--muted)}
.punto {width:9px; height:9px; border-radius:50%; background:var(--flat); flex:none}
.punto.ok {background:var(--up)} .punto.aviso {background:var(--amber)}
nav {position:fixed; bottom:0; left:0; right:0; max-width:550px; margin:auto; background:#121a1f; display:flex;
  border-top:1px solid var(--line); padding:4px 4px max(5px,var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
nav button {flex:1 1 auto; min-width:0; min-height:48px; padding:5px 3px; font-size:12px; white-space:nowrap; background:none; border:0; border-bottom:2px solid transparent}
nav button[aria-current="page"] {color:#8ee7ca; border-color:#8ee7ca}
summary {cursor:pointer; padding:3px 0}
table {width:100%; border-collapse:collapse; margin-top:8px}
td,th {padding:6px 0; text-align:left; border-bottom:1px solid var(--line)}
td:last-child,th:last-child {text-align:right}
a {color:#91dcca}
</style>
</head>
<body>
<main>
  <header>
    <small>ECUADOR · PROTOTIPO CON DATOS REALES</small>
    <div class="titulo"><h1>Radar Financiero Ecuador</h1>
      <button type="button" class="engrane" data-tab="Configuración" aria-label="Configuración">⚙</button></div>
    <label for="fecha">Consultar al cierre de</label>
    <select id="fecha"></select>
    <div class="estado" id="estado"><span class="punto"></span><span>Cargando datos…</span></div>
  </header>
  <div id="vista"></div>
</main>
<nav id="menu" aria-label="Navegación principal"></nav>

<script>
"use strict";

/* Datos: 1) en línea desde radar-datos; 2) última copia guardada en el equipo; 3) copia incluida en este archivo. */
const URL_DATOS = "https://raw.githubusercontent.com/Logaritmica-APP/radar-datos/main/radar.json";
const CLAVE_LOCAL = "radar.json";
const COPIA_INCLUIDA = /*COPIA*/null/*FIN_COPIA*/;

const $ = s => document.querySelector(s);
const fecha = $("#fecha"), vista = $("#vista"), menu = $("#menu"), estadoEl = $("#estado");
const tabs = ["Inicio","Indicadores","Alertas","Noticias","Regulación"];
const DESTACADOS = ["pais","reservas","ia","piba","empleo","tpr","tar","brent","wti","oro","plata","t10","fed","eurusd","btc","eth"];
const PENDIENTES_ECUADOR = [];
let tab = "Inicio", detalle = null, datos = null, series = [], fuentes = {}, hoy = null;

async function cargar() {
  let origen;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(URL_DATOS + "?t=" + Date.now(), {signal: ctl.signal, cache: "no-store"});
    clearTimeout(t);
    if (!r.ok) throw new Error("HTTP " + r.status);
    datos = await r.json();
    try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify(datos)); } catch (e) {}
    origen = {cls:"ok", texto:"En línea · datos generados el " + momento(datos.generado)};
  } catch (e) {
    let guardado = null;
    try { guardado = JSON.parse(localStorage.getItem(CLAVE_LOCAL) || "null"); } catch (e2) {}
    if (guardado) {
      datos = guardado;
      origen = {cls:"aviso", texto:"No se pudo consultar en línea · datos guardados el " + momento(datos.generado)};
    } else if (COPIA_INCLUIDA) {
      datos = COPIA_INCLUIDA;
      origen = {cls:"aviso", texto:"No se pudo consultar en línea · copia incluida del " + momento(datos.generado)};
    } else {
      estadoEl.innerHTML = `<span class="punto"></span><span>No hay datos disponibles. Revise la conexión.</span>`;
      return;
    }
  }
  estadoEl.innerHTML = `<span class="punto ${origen.cls}"></span><span>${origen.texto}</span>`;
  preparar();
}

function preparar() {
  fuentes = Object.fromEntries(datos.fuentes.map(f => [f.id, f]));
  series = datos.indicadores.filter(i => datos.observaciones[i.id]).map(i => {
    const obs = datos.observaciones[i.id];
    return {...i, fechas: obs.map(o => o[0]), valores: obs.map(o => o[1]), superiores: obs.map(o => o[2] ?? undefined),
            publicados: obs.map(o => o[3] || o[0]), estimadas: obs.map(o => o[4] === 1)};
  });
  const diarias = new Set();
  series.filter(s => s.frecuencia === "diaria").forEach(s => s.fechas.slice(-30).forEach(f => diarias.add(f)));
  /* El corte más reciente es hoy (fecha de generación de los datos), para incluir lo publicado después del último cierre de mercado. */
  hoy = new Date(datos.generado).toLocaleDateString("en-CA", {timeZone:"America/Guayaquil"});
  diarias.add(hoy);
  const fechas = [...diarias].sort().reverse().slice(0, 15);
  fecha.innerHTML = "";
  fechas.forEach(f => fecha.add(new Option((f === hoy ? "Hoy, " : "") + fechaLarga(f), f)));
  fecha.value = fechas[0];
  dibujar();
}

function momento(iso) {
  return new Date(iso).toLocaleString("es-EC", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"America/Guayaquil"});
}
function fechaLarga(iso) {
  return new Date(iso+"T12:00:00Z").toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
}
function corta(iso) {
  return new Date(iso+"T12:00:00Z").toLocaleDateString("es-EC",{day:"numeric",month:"short",year:"2-digit",timeZone:"UTC"});
}
function etiqueta(s,iso) {
  if (s.frecuencia === "trimestral") { const m = +iso.slice(5,7); return ["I","II","III","IV"][Math.floor((m-1)/3)] + " trim " + iso.slice(0,4); }
  if (s.frecuencia === "mensual") return new Date(iso+"T12:00:00Z").toLocaleDateString("es-EC",{month:"short",year:"numeric",timeZone:"UTC"});
  return corta(iso);
}
function num(v,d) {
  return new Intl.NumberFormat("es-EC",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
}
function puntos(s) {
  const p = [];
  /* Solo datos ya publicados al corte elegido. */
  for (let i = 0; i < s.fechas.length; i++)
    if (s.publicados[i] <= fecha.value) p.push({f:s.fechas[i], v:s.valores[i], sup:s.superiores[i], pub:s.publicados[i], est:s.estimadas[i]});
  return p;
}
function estado(s,p) {
  const ult=p.at(-1), ant=p.at(-2);
  if (!ult || !ant) return {cls:"flat",texto:"Sin comparación"};
  const a = s.es_rango ? ult.sup : ult.v, b = s.es_rango ? ant.sup : ant.v;
  let delta = a - b, unidad = s.unidad_variacion, dec = s.decimales;
  if (unidad === "pb") { if (s.unidad === "%") delta *= 100; dec = 0; }
  else if (unidad === "%" && s.unidad !== "%") { delta = (a / b - 1) * 100; dec = 2; }
  delta = Number(delta.toFixed(dec));
  return {cls:delta>0?"up":delta<0?"down":"flat",
          texto:(delta>0?"↑ +":delta<0?"↓ −":"= ")+num(Math.abs(delta),dec)+" "+unidad};
}
function valor(s,o) {
  return s.es_rango ? num(o.v,2)+"–"+num(o.sup,2)+" %" : num(o.v,s.decimales)+" "+s.unidad;
}
function grafico(p,cls,mini=false) {
  if (!p.length) return "";
  const w=mini?60:320, h=mini?28:138, margen=mini?3:9;
  const xs=p.map(a=>Date.parse(a.f+"T12:00:00Z")), ys=p.map(a=>a.sup ?? a.v);
  const xmin=xs[0], xmax=xs.at(-1), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const xy=p.map((_,i)=>{
    const x=xmax===xmin?w/2:margen+(xs[i]-xmin)/(xmax-xmin)*(w-2*margen);
    const y=ymax===ymin?h/2:h-margen-(ys[i]-ymin)/(ymax-ymin)*(h-2*margen);
    return [x.toFixed(1),y.toFixed(1)];
  });
  const circulos = p.length <= 40 ? xy.filter((_,i)=>!p[i].paso).map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${mini?1.2:3}" fill="currentColor"/>`).join("") : "";
  return `<svg class="${mini?"spark":"chart"} ${cls}" viewBox="0 0 ${w} ${h}" ${mini?'aria-hidden="true"':'role="img" aria-label="Evolución hasta la fecha seleccionada"'}>
     ${mini?"":`<path d="M0 ${h/2} H${w}" stroke="#344349" stroke-width="1"/>`}
     <polyline points="${xy.map(a=>a.join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="${mini?1.8:2.2}"/>
     ${circulos}</svg>`;
}
function escalones(p) {
  /* Un rango se mantiene hasta la siguiente decisión: se dibuja en escalones hasta la fecha consultada. */
  const out = [];
  p.forEach((x,i) => { if (i) out.push({f:x.f, v:p[i-1].v, sup:p[i-1].sup, paso:true}); out.push(x); });
  if (p.length && fecha.value > p.at(-1).f) out.push({...p.at(-1), f:fecha.value, paso:true});
  return out;
}
/* Dato atrasado: el último dato es más viejo de lo normal para su fuente (la fuente no ha publicado).
   Diarias: días hábiles desde el último dato; mensuales y trimestrales: días corridos desde la fecha del dato. */
const RETRASO = {
  bce: ["habiles", 2, "un día hábil"], bce_oro: ["habiles", 2, "un día hábil"], tesoro: ["habiles", 2, "un día hábil"],
  bce_europeo: ["habiles", 2, "un día hábil"], coingecko: ["corridos", 2, "un día"], bcrp: ["habiles", 4, "unos 2 días hábiles"],
  eia: ["habiles", 8, "una semana"], inec_ipc: ["corridos", 55, "unos 15 días después del fin de mes"],
  inec_empleo: ["corridos", 60, "unos 22 días después del fin de mes"], bce_reservas: ["corridos", 55, "a mediados del mes siguiente"],
  bce_tasas: ["corridos", 40, "antes de empezar cada mes"], bce_pib: ["corridos", 190, "unos 3 meses después del trimestre"]};
function habilesEntre(a, b) {
  let n = 0; const d = new Date(a + "T12:00:00"), fin = new Date(b + "T12:00:00");
  while (d < fin) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n++; }
  return n;
}
function atrasado(s, u) {
  const r = RETRASO[s.fuente_id];
  if (!r || !u || s.es_rango) return null;              // la Fed solo cambia en sus reuniones: nunca "atrasada"
  const n = r[0] === "habiles" ? habilesEntre(u.f, fecha.value) : (Date.parse(fecha.value) - Date.parse(u.f)) / 864e5;
  return n > r[1] ? {n: Math.round(n), tipo: r[0], normal: r[2]} : null;
}
/* Precio del momento (aún no es cierre): se marca como parcial con la hora de la consulta. */
function parcial(s, u) {
  const p = datos?.provisionales?.[s.id];
  return p && u && p.fecha === u.f ? p : null;
}
function fila(s) {
  const p=puntos(s), u=p.at(-1), e=estado(s,p);
  if (!u) return "";
  return `<button type="button" class="row" data-id="${s.id}">
    <span><strong>${s.nombre}</strong><small>${etiqueta(s,u.f)}${parcial(s,u) ? `, ${parcial(s,u).hora} (parcial)` : ""}${atrasado(s,u) ? ` · <span class="atrasado">dato atrasado</span>` : ""} · ${(fuentes[s.fuente_id]?.cita || "").replace("Fuente: ","").split(" · ")[0]}${s.fuente_id==="coingecko" ? " · prueba" : ""}</small></span>
    ${grafico(s.es_rango ? escalones(p.slice(-6)) : p.slice(-20),e.cls,true)}
    <span class="quote ${e.cls}"><strong>${valor(s,u)}</strong><small>${e.texto} ›</small></span>
  </button>`;
}
function ficha(s) {
  const p=puntos(s), u=p.at(-1), a=p.at(-2), e=estado(s,p), f=fuentes[s.fuente_id] || {};
  if (!u) return `<button class="back" data-back>‹ Volver</button><p>Sin observaciones para esta fecha.</p>`;
  const tramo = s.es_rango ? p.slice(-12) : p.slice(-60);
  const trazo = s.es_rango ? escalones(tramo) : tramo;
  const est = datos.estado?.[s.fuente_id];
  return `<button type="button" class="back" data-back>‹ Volver</button>
    <h2>${s.nombre}</h2>
    <div class="big ${e.cls}">${valor(s,u)}</div>
    <b class="${e.cls}">${e.texto}</b>
    ${atrasado(s,u) ? `<p class="atrasado">Dato atrasado: la fuente no ha publicado nada nuevo desde el ${corta(u.f)}. Lo normal es que publique con un rezago de ${atrasado(s,u).normal}. Se mostrará apenas lo publique.</p>` : ""}
    ${parcial(s,u) ? `<p class="muted">Precio parcial consultado a las ${parcial(s,u).hora}; se reemplaza por el cierre del día (19:00).</p>` : ""}
    <p>Dato ${s.frecuencia==="diaria"?"del":"de"} <b>${etiqueta(s,u.f)}</b>${a?`; comparación con ${s.frecuencia==="diaria"?"el ":""}${etiqueta(s,a.f)}`:""}.</p>
    ${u.pub!==u.f ? `<p class="muted">Publicado el ${corta(u.pub)}${u.est ? " (fecha estimada)" : ""}.</p>` : ""}
    ${u.f!==fecha.value && fecha.value!==hoy && s.frecuencia==="diaria"?`<p class="muted">Sin nueva observación en el corte elegido. Se conserva el último dato disponible.</p>`:""}
    <div class="card"><strong>${s.es_rango ? "Últimos cambios de rango" : "Últimas " + tramo.length + " observaciones"}</strong>
      ${grafico(trazo,e.cls)}
      <div class="ends"><small>${etiqueta(s,tramo[0].f)}</small><small>${etiqueta(s,trazo.at(-1).f)}</small></div>
    </div>
    <details class="card"><summary>Ver valores por fecha</summary><table>
      <tr><th>Observación</th><th>Valor</th></tr>
      ${tramo.slice(-15).reverse().map(x=>`<tr><td>${etiqueta(s,x.f)}</td><td>${valor(s,x)}</td></tr>`).join("")}
    </table></details>
    ${(datos.cambios?.[s.id] || []).map(c=>`<div class="card alert"><small class="tag">CAMBIO METODOLÓGICO · ${c.fecha}</small><p>${c.descripcion}</p></div>`).join("")}
    <p class="muted">${f.cita || ""}${est ? ` · última descarga correcta: ${momento(est.ultima_descarga_correcta)}` : ""}</p>
    ${f.url ? `<a href="${f.url}" target="_blank" rel="noopener">Ir a la fuente oficial ↗</a>` : ""}`;
}
/* Noticias con historia, calculadas con los datos (sin redacción manual):
   1) publicación de un dato de Ecuador (inflación, desempleo, PIB) en su fecha de publicación;
   2) cambio de rango de la Reserva Federal;
   3) movimiento diario inusual: variación mayor a 3 desviaciones estándar de las 250 variaciones previas. */
/* Petróleo: solo WTI (referencia del crudo ecuatoriano); Brent se mueve casi igual y duplicaría avisos. */
const DIARIAS_NOTICIA = ["pais","wti","oro","plata","t10","eurusd","btc","eth"], UMBRAL_INUSUAL = 3, DIAS_ACUM = 5;
/* Sensibilidad (Configuración): umbral de "movimiento relevante" en desviaciones estándar. El inusual es siempre 3. */
const SENSIBILIDAD = {alta: ["Alta", 1.75], media: ["Media", 2], baja: ["Baja", 2.5]};
const CLAVE_SENS = "radar_sensibilidad";
let sensibilidad = "media";
try { sensibilidad = localStorage.getItem(CLAVE_SENS) || "media"; } catch (e) {}
if (!SENSIBILIDAD[sensibilidad]) sensibilidad = "media";
function eleccionSensibilidad() {
  return `<h2>Sensibilidad de alertas</h2><small>Cuántas desviaciones estándar de su movimiento normal debe moverse un indicador para avisar.</small>
    <div class="card">${Object.entries(SENSIBILIDAD).map(([id, [nombre, k]]) => `
      <label class="check"><input type="radio" name="sens" data-sens="${id}" ${sensibilidad === id ? "checked" : ""}>
        ${nombre} <small>· desde ${num(k, k % 1 ? 2 : 0)} desviaciones${id === "media" ? " (recomendada)" : ""}</small></label>`).join("")}</div>`;
}
const cacheMov = {};
/* Movimientos de cada indicador (solo cierres):
   - diario: |variación del día − media| ≥ k·σ  (σ: desviación de las 250 variaciones diarias previas);
   - acumulado: variación de 5 días ≥ k·σ·√5, si ese día no hubo alerta diaria ni otra acumulada en los 4 días previos. */
function movimientos(s) {
  let p = puntos(s); const k = SENSIBILIDAD[sensibilidad][1], clave = s.id + fecha.value + k;
  if (parcial(s, p.at(-1))) p = p.slice(0, -1);
  if (cacheMov[clave]) return cacheMov[clave];
  const pct = s.unidad_variacion === "%" && s.unidad !== "%";
  const cambio = (a, b) => pct ? (b.v / a.v - 1) * 100 : b.v - a.v;
  const d = p.map((x,i) => i ? cambio(p[i-1], x) : null);
  const out = []; let ultimaAcum = -99;
  for (let i = 61; i < p.length; i++) {
    const prev = d.slice(Math.max(1, i - 250), i), m = prev.reduce((a,b)=>a+b,0) / prev.length;

function oracion(t) {

  const letras = x.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, "");
  const mayus = letras.replace(/[^A-ZÁÉÍÓÚÑ]/g, "").length / Math.max(letras.length, 1);
  if (mayus < 0.85) return x;
  /* Pasa a minúsculas salvo los códigos de resolución (SEPS-..., JPRFM-...) */
  return x.split(" ").map((w, i) => /^[A-Z]{2,}-[A-Z0-9-]+$/.test(w) ? w : (i === 0 ? w.charAt(0) + w.slice(1).toLowerCase() : w.toLowerCase())).join(" ");

  guardarElegidos(); dibujar();
});
fecha.addEventListener("change",dibujar);
/* App Android: el botón "atrás" del teléfono cierra la ficha o vuelve a Inicio antes de salir. */
const AppNativo = window.Capacitor?.Plugins?.App;
if (AppNativo) AppNativo.addListener("backButton", () => {
  if (detalle) detalle = null;
  else if (tab !== "Inicio") tab = "Inicio";
  else { AppNativo.exitApp(); return; }
  dibujar(); window.scrollTo(0, 0);
});
/* Al volver a la app (estaba en segundo plano), se descargan los datos más recientes. */
if (AppNativo) AppNativo.addListener("resume", () => cargar());
dibujar();
cargar();
</script>
</body>
</html>
